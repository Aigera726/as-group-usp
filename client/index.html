<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      Нажатия в интерфейсе - в общий журнал действий (модуль на 9010).
      Серверу видны только запросы: «открыл смету» он покажет, а «нажал
      Согласовать, потом Отмена» - нет. На вопрос «куда нажал» отвечает только
      браузер.

      data-token-key="token": пропуск модуля лежит в localStorage под этим
      ключом (см. src/api.js) и уходит в Authorization: Bearer. Читается
      перед каждой отправкой, а не один раз - пропуск обновляется по
      refresh_token, и запомненный при загрузке через час был бы просрочен.

      Адрес абсолютный: клиент отдаётся с одного порта, а API слушает на 9002
      (см. baseURL в src/api.js). {host} подставляет скрипт - имя хоста у
      стенда меняется, и прописать его целиком нельзя.
    -->
    <script
      src="/journal-ui.js"
      data-endpoint="http://{host}:9002/api/estimates/journal/ui"
      data-token-key="token"
      defer
    ></script>
  </body>
</html>
